<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escola Digital de Design — Formação Profissional em Design Gráfico, Digital e Motion</title>
  <meta name="description" content="Plataforma de formação profissional completa em Design Gráfico, Design Digital e Motion Design com cursos estruturados, progresso real, avaliações, portfólio, certificados e central de ajuda contextual." />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Estilos da Plataforma -->
  <link rel="stylesheet" href="./src/styles/tokens.css" />
  <link rel="stylesheet" href="./src/styles/layout.css" />
  <link rel="stylesheet" href="./src/styles/components.css" />
</head>
<body>
  <div id="root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background-color: #0a0e17; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
      <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 800; color: white; box-shadow: 0 10px 25px rgba(99,102,241,0.4);">
        ED
      </div>
      <div style="font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em;">
        Escola Digital de Design
      </div>
      <div style="display: flex; align-items: center; gap: 10px; color: #94a3b8; font-size: 0.88rem;">
        <span style="display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(99,102,241,0.3); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite;"></span>
        <span>Carregando plataforma...</span>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
  </div>

  <!-- Script Modular da Aplicação -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
